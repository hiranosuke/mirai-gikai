# みらい議会＠さいたま市 PoC 用の計測スタック。
# ローカル Supabase の Postgres を直接読む Grafana を 1 コンテナで起動する。
# 詳細は observability/README.md を参照。
services:
  grafana:
    image: grafana/grafana:11.3.0
    container_name: mirai-gikai-grafana
    restart: unless-stopped
    ports:
      # web(3000) / admin(3001) と衝突しないよう 3002 に割り当てる
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      # サインアップ無効・匿名アクセス無効（ローカル運用前提）
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # プロビジョニング済みダッシュボードから参照するデータソース接続情報。
      # ローカル Supabase の既定値を採用（supabase/config.toml の db.port=54432）。
      MIRAI_DB_HOST: ${MIRAI_DB_HOST:-host.docker.internal}
      MIRAI_DB_PORT: ${MIRAI_DB_PORT:-54432}
      MIRAI_DB_NAME: ${MIRAI_DB_NAME:-postgres}
      MIRAI_DB_USER: ${MIRAI_DB_USER:-postgres}
      MIRAI_DB_PASSWORD: ${MIRAI_DB_PASSWORD:-postgres}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    extra_hosts:
      # Linux でコンテナからホスト（Supabase）へ到達するための設定
      - "host.docker.internal:host-gateway"

volumes:
  grafana-data:
